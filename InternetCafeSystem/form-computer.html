<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Computers — CaféNet</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════
       NAVBAR
  ═══════════════════════════════════ -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">☕ CaféNet</a>
    <ul class="nav-links">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="form-start-session.html">Start Session</a></li>
      <li><a href="form-end-session.html">End Session</a></li>
      <li><a href="form-computer.html" class="active">Computers</a></li>
      <li><a href="transactions.html">Transactions</a></li>
    </ul>
    <a id="authBtn" href="form-login.html" class="btn btn-sm">Login</a>
  </nav>

  <!-- ═══════════════════════════════════
       MAIN CONTENT
  ═══════════════════════════════════ -->
  <main class="main-content">

    <h2 class="section-title">🖥️ Computer Management</h2>

    <!-- ADD / UPDATE FORM -->
    <div class="card">
      <h3 class="card-title" id="formHeading">➕ Add New Computer</h3>

      <form id="computerForm" onsubmit="saveComputer(event)" novalidate>

        <!-- Hidden edit ID -->
        <input type="hidden" id="editId" value="" />

        <!-- Row 1 -->
        <div class="form-grid">
          <div class="form-group">
            <label for="pcNumber">PC Number <span class="req">*</span></label>
            <input
              type="number"
              id="pcNumber"
              min="1"
              max="99"
              required
              placeholder="e.g. 1"
            />
            <span class="field-hint">1 – 99</span>
          </div>

          <div class="form-group">
            <label for="pcType">PC Type <span class="req">*</span></label>
            <select id="pcType" required>
              <option value="">-- Select --</option>
              <option value="regular">Regular (₱20/hr)</option>
              <option value="gaming">Gaming (₱30/hr)</option>
              <option value="student">Student (₱15/hr)</option>
            </select>
          </div>
        </div>

        <!-- Row 2 -->
        <div class="form-grid">
          <div class="form-group">
            <label for="pcStatus">Status</label>
            <select id="pcStatus">
              <option value="available">Available</option>
              <option value="maintenance">Under Maintenance</option>
              <option value="reserved">Reserved</option>
            </select>
          </div>
        </div>

        <!-- Remarks -->
        <div class="form-group">
          <label for="pcRemarks">Remarks</label>
          <textarea id="pcRemarks" rows="2" placeholder="Optional notes about this computer..."></textarea>
        </div>

        <!-- Error -->
        <div class="form-error" id="formError"></div>

        <!-- Buttons -->
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="saveBtn">💾 Save Computer</button>
          <button type="button" class="btn btn-outline" onclick="resetComputerForm()">🔄 Reset</button>
          <a href="dashboard.html" class="btn btn-outline">← Back to Dashboard</a>
        </div>

      </form>
    </div>

    <!-- COMPUTER INVENTORY TABLE -->
    <div class="card">
      <h3 class="card-title">💻 Computer Inventory</h3>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>PC #</th>
              <th>Type</th>
              <th>Status</th>
              <th>Remarks</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="computersBody">
            <tr><td colspan="6" class="no-data">No computers added yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="footer" id="sharedFooter"></footer>

  <script src="js/shared.js"></script>
  <script src="js/computer.js"></script>
</body>
</html>
